name: Draft ideas

on:
  # Seeds PR merged → draft from inbox and open a review PR (auto-merged)
  push:
    branches: [main]
    paths:
      - "scripts/seeds/inbox/**/*.json"
  workflow_dispatch:
    inputs:
      mode:
        description: "Draft mode"
        required: true
        default: all-thin
        type: choice
        options:
          - all-thin
          - football-film
          - nba-analytics
          - wnba
          - sports-biz
          - ai-agents
      count:
        description: "Ideas per topic"
        required: true
        default: "4"

jobs:
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check seeds inbox (push trigger)
        id: inbox
        if: github.event_name == 'push'
        run: |
          shopt -s nullglob
          files=(scripts/seeds/inbox/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "has_seeds=false" >> "$GITHUB_OUTPUT"
            echo "No seed JSON in inbox — nothing to draft"
          else
            echo "has_seeds=true" >> "$GITHUB_OUTPUT"
            printf 'Seed files:\n'
            printf ' - %s\n' "${files[@]}"
          fi

      - name: Draft idea cards
        id: draft
        if: github.event_name == 'workflow_dispatch' || steps.inbox.outputs.has_seeds == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4o-mini
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "Missing secret OPENAI_API_KEY"
            exit 1
          fi
          COUNT="${{ inputs.count || '4' }}"
          if [ "${{ github.event_name }}" = "push" ]; then
            node scripts/draft-ideas.mjs --seeds-dir scripts/seeds/inbox --count "$COUNT"
          else
            MODE="${{ inputs.mode }}"
            if [ "$MODE" = "all-thin" ]; then
              node scripts/draft-ideas.mjs --all-thin --count "$COUNT"
            else
              node scripts/draft-ideas.mjs --topic "$MODE" --count "$COUNT"
            fi
          fi

      - name: Archive processed seeds
        if: github.event_name == 'push' && steps.inbox.outputs.has_seeds == 'true'
        run: |
          shopt -s nullglob
          stamp=$(date -u +%Y%m%d-%H%M%S)
          mkdir -p scripts/seeds/archive
          for f in scripts/seeds/inbox/*.json; do
            base=$(basename "$f" .json)
            mv "$f" "scripts/seeds/archive/${base}-${stamp}.json"
          done

      - name: Open PR with drafts
        if: github.event_name == 'workflow_dispatch' || steps.inbox.outputs.has_seeds == 'true'
        env:
          # PAT required so merge push triggers Deploy; GITHUB_TOKEN merges do not chain workflows
          GH_TOKEN: ${{ secrets.THINKER_BOT_TOKEN || github.token }}
        run: |
          if ! ls scripts/drafts/ideas-*.json >/dev/null 2>&1; then
            echo "No draft files produced"
            exit 1
          fi
          BRANCH="draft-ideas-$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "thinker-bot"
          git config user.email "bot@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -f scripts/drafts/ideas-*.json
          git add public/content/idea-drafts.json
          if [ "${{ github.event_name }}" = "push" ]; then
            git add scripts/seeds/inbox scripts/seeds/archive
          fi
          if git diff --staged --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "chore: LLM idea drafts for review"
          git push -u origin HEAD
          BODY="$(cat <<'EOF'
          ## Summary
          - Auto-generated Idea card drafts (`draft-ideas.mjs`)
          - Review queue updated: `public/content/idea-drafts.json`
          - Archive JSON under `scripts/drafts/`

          **Auto-merges** → deploy ships the queue → Keep / Reject in the feed.
          Keep attaches the seed note and auto-queues promote to the live pool.

          ## Test plan
          - [ ] Skim draft titles/bodies for voice and duplicates (PR history)
          - [ ] After deploy, cards show “From loop” in the feed
          - [ ] Keep continue or Reject noise
          EOF
          )"
          if [ "${{ github.event_name }}" = "push" ]; then
            BODY="$(cat <<'EOF'
          ## Summary
          - Drafted from seeds that landed in `scripts/seeds/inbox/` (now archived)
          - Review queue updated: `public/content/idea-drafts.json`
          - Archive JSON under `scripts/drafts/`

          **Auto-merges** → deploy ships the queue → Keep / Reject in the feed.
          Keep attaches the seed note and auto-queues promote to the live pool.

          ## Test plan
          - [ ] Skim draft titles/bodies for voice and duplicates (PR history)
          - [ ] After deploy, cards show “From loop” in the feed
          - [ ] Keep continue or Reject noise
          EOF
          )"
          fi
          PR_URL="$(gh pr create \
            --title "chore: LLM idea drafts for review" \
            --body "$BODY")"
          gh pr merge --squash --delete-branch "$PR_URL"
